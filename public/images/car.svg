  <path d="M296 50 C320 50 340 57 352 64" stroke="#7a2a00" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M296 110 C320 110 340 103 352 96" stroke="#7a2a00" stroke-width="2.5" fill="none" stroke-linecap="round"/>
