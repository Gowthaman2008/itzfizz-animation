<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="400" height="160">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c94a08"/><stop offset=".28" stop-color="#ff7a14"/>
      <stop offset=".5" stop-color="#ffa04a"/><stop offset=".72" stop-color="#ff7a14"/>
      <stop offset="1" stop-color="#c94a08"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d1218"/><stop offset=".6" stop-color="#27323d"/><stop offset="1" stop-color="#3f4e5c"/>
    </linearGradient>
    <path id="half" d="M20 80 L20 54 C20 42 30 38 56 34 L150 27 C200 23 252 24 300 32 C342 40 372 58 390 74 L392 80 Z"/>
  </defs>
  <!-- wheels -->
  <g fill="#0a0a0a">
    <rect x="62" y="10" width="46" height="28" rx="7"/><rect x="286" y="10" width="46" height="28" rx="7"/>
    <rect x="62" y="122" width="46" height="28" rx="7"/><rect x="286" y="122" width="46" height="28" rx="7"/>
  </g>
  <g fill="#262a2e">
    <rect x="70" y="14" width="30" height="5" rx="2.5"/><rect x="294" y="14" width="30" height="5" rx="2.5"/>
    <rect x="70" y="141" width="30" height="5" rx="2.5"/><rect x="294" y="141" width="30" height="5" rx="2.5"/>
  </g>
  <!-- body (top half mirrored) -->
  <use href="#half" fill="url(#body)"/>
  <use href="#half" fill="url(#body)" transform="translate(0 160) scale(1 -1)"/>
  <use href="#half" fill="none" stroke="#7a2a00" stroke-opacity=".4" stroke-width="1.5"/>
  <use href="#half" fill="none" stroke="#7a2a00" stroke-opacity=".4" stroke-width="1.5" transform="translate(0 160) scale(1 -1)"/>
  <!-- mirrors -->
  <ellipse cx="268" cy="24" rx="8" ry="4" fill="#c94a08"/><ellipse cx="268" cy="136" rx="8" ry="4" fill="#c94a08"/>
  <!-- side intakes -->
  <path d="M176 29 L236 29 L222 38 L186 38Z" fill="#150d08"/>
  <path d="M176 131 L236 131 L222 122 L186 122Z" fill="#150d08"/>
  <!-- engine cover -->
  <rect x="40" y="60" width="88" height="40" rx="10" fill="#111" opacity=".88"/>
  <path d="M52 68H116M52 75H116M52 82H116M52 89H116" stroke="#ff7a14" stroke-width="2" opacity=".55"/>
  <!-- cabin -->
  <path d="M146 56 C176 50 228 50 258 58 L272 80 L258 102 C228 110 176 110 146 104 L134 80 Z" fill="url(#glass)"/>
  <path d="M172 63 C198 59 222 59 244 65 L252 80 L244 95 C222 101 198 101 172 97 L164 80 Z" fill="#ff8a24"/>
  <rect x="172" y="78" width="78" height="4" fill="#1a1a1a" opacity=".45"/>
