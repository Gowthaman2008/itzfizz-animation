  <path d="M348 62 L378 70 L372 75 L346 69Z" fill="#e8f4ff"/>
  <path d="M348 98 L378 90 L372 85 L346 91Z" fill="#e8f4ff"/>
  <rect x="20" y="52" width="6" height="22" rx="3" fill="#ff2a2a"/><rect x="20" y="86" width="6" height="22" rx="3" fill="#ff2a2a"/>
</svg>
